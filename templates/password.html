{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>修改后台密码</h1></div>
<form method="post" class="card form-stack wide-form">
  <label>当前密码<input type="password" name="old_password" required></label>
  <label>新密码<input type="password" name="new_password" minlength="10" required></label>
  <label>确认新密码<input type="password" name="confirm_password" minlength="10" required></label>
  <button class="btn primary" type="submit">修改密码</button>
</form>
{% endblock %}
